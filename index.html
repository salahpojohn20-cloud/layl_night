<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layl Night 🌙</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Mouse Glow Effect -->
    <div id="mouse-glow"></div>

    <!-- Background Elements -->
    <div id="sky-container">
        <div id="moon"></div>
        <div id="stars"></div>
        <div id="shooting-stars"></div>
    </div>

    <!-- Music Player -->
    <audio id="bg-music" src="assets/music.mp3" loop></audio>
    <button id="music-toggle" class="floating-btn hidden">
        🎵
    </button>

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Intro Screen -->
    <section id="intro" class="fullscreen-section">
        <div class="intro-content">
            <h1 class="main-title">Layl Night 🌙</h1>
            <p class="subtitle">Tonight isn't just another night...</p>
            <p class="subtitle delay">A little surprise is waiting for you.</p>
            <button id="btn-enter" class="glow-btn mt-2">Enter</button>
        </div>
    </section>

    <!-- Main Content (Photos & Quotes) -->
    <section id="main-content" class="fullscreen-section hidden">
        <div class="glass-card">
            <div id="media-container">
                <img id="photo-1" src="https://i.postimg.cc/8FwxyG7n/IMG-20260731-111716-154.jpg" class="photo active" alt="Memory 1">
                <img id="photo-2" src="https://i.postimg.cc/bGL46PZ6/IMG-20260731-111721-289.jpg" class="photo" alt="Memory 2">
            </div>
            
            <div id="text-container">
                <h2 id="name-display" class="highlight-text"></h2>
                <p id="quote-display" class="quote-text"></p>
            </div>

            <div class="controls">
                <button id="btn-next" class="glow-btn">Next ✨</button>
                <button id="btn-gift" class="glow-btn hidden">🎁 Open Your Gift</button>
            </div>
        </div>
    </section>

    <!-- Final Message Screen -->
    <section id="final-screen" class="fullscreen-section hidden">
        <div class="glass-card final-card" dir="rtl">
            <p id="final-message-text" class="arabic-text"></p>
            <button id="btn-replay" class="glow-btn mt-2 hidden">Replay 🌙</button>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
